name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploys are not here: Cloudflare Workers Builds (the Git connector) builds with `pnpm cf:build`
  # and runs `wrangler deploy` on main and `wrangler versions upload` on other branches.
  # Protect main with this check so a red build never merges.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      ARCADE_SITE_URL: https://arcade.steamfield.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium webkit

      # Same commands agents run locally, so "passes locally" means the same thing here.
      - run: pnpm arcade check --all
      - run: pnpm arcade smoke

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            games/*/test-results
            templates/*/test-results
            games/*/playwright-report
            templates/*/playwright-report
          retention-days: 7

  # Which per-game suites a push or pull request touches, so slow ones skip when nothing they test changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rush-racers: ${{ steps.filter.outputs.rush-racers }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rush-racers:
              - 'games/rush-racers/**'
              - 'packages/core/**'
              - 'packages/config/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  # Rush Racers' 30-seed difficulty bars: too slow for check, and over half an hour on one runner,
  # so they run here in parallel shards (by file) beside the check job, and only when Rush Racers'
  # logic or what it builds on changed. A skipped job counts as passing for a required check.
  difficulty:
    needs: changes
    if: needs.changes.outputs.rush-racers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter game-rush-racers test:difficulty --shard=${{ matrix.shard }}/4
